<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <link rel="stylesheet" href="carrito.css">
    
    <title>Urbano Clothes - Mi Carrito</title>
</head>
<body>
    <header class="header">
        <h1>Urbano Clothes</h1>
        <a href="index.html" class="link-nav">Volver al Inicio</a>
    </header>

    <main>
        <section class="carrito" id="seccion-carrito">
            <h2>Tu Carrito</h2>
            
            <div class="itemsCarrito">
                <div class="itemCarrito">
                    <img src="https://polamarketing.com/wp-content/uploads/2025/08/1.jpg" alt="Producto 1" class="imgItemCarrito">
                    <div class="detallesItem">
                        <h4>Producto 1</h4>
                        <p>$18.000</p>
                        <div class="cantidadItem">
                            <button class="btnCantidad">-</button>
                            <span>1</span>
                            <button class="btnCantidad">+</button>
                        </div>
                    </div>
                    <button class="btnEliminar">X</button>
                </div>
                
                <div class="itemCarrito">
                    <img src="https://img.magnific.com/free-photo/two-beautiful-women-posing-camera-fashionable-clothes_132075-14007.jpg?semt=ais_hybrid&w=740&q=80" alt="Producto 2" class="imgItemCarrito">
                    <div class="detallesItem">
                        <h4>Producto 2</h4>
                        <p>$15.000</p>
                        <div class="cantidadItem">
                            <button class="btnCantidad">-</button>
                            <span>2</span>
                            <button class="btnCantidad">+</button>
                        </div>
                    </div>
                    <button class="btnEliminar">X</button>
                </div>
            </div>

            <div class="totalCarrito">
                <h3>Total: $48.000</h3>
            </div>

            <div class="accionesCarrito">
                <button id="btnVaciar" class="btnSecundario">Vaciar</button>
                <button id="btnComprar" class="btnPrincipal">Comprar</button>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Urbano Clothes. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
