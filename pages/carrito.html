<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../estilos/carrito.css">
    <title>Urbano Clothes - Mi Carrito</title>
</head>
<body>

    <header class="header">
        <h1>Urbano Clothes</h1>
        <nav class="nav-header">
            <a href="../index.html" class="link-nav">Inicio</a>
            <a href="tienda.html" class="link-nav">Tienda</a>
            <a href="carrito.html" class="link-nav link-nav--activo">🛒 Carrito</a>
        </nav>
    </header>

    <main>

        <section class="carrito" id="seccion-carrito">
            <h2>Tu Carrito</h2>

            <div class="itemsCarrito">

                <div class="itemCarrito">
                    <img src="https://polamarketing.com/wp-content/uploads/2025/08/1.jpg" alt="Producto 1" class="imgItemCarrito">
                    <div class="detallesItem">
                        <h4>Producto 1</h4>
                        <p class="precioItem">$18.000</p>
                        <div class="cantidadItem">
                            <button class="btnCantidad">-</button>
                            <span class="numeroItem">1</span>
                            <button class="btnCantidad">+</button>
                        </div>
                    </div>
                    <button class="btnEliminar" title="Eliminar">✕</button>
                </div>

                <div class="itemCarrito">
                    <img src="https://img.magnific.com/free-photo/two-beautiful-women-posing-camera-fashionable-clothes_132075-14007.jpg?semt=ais_hybrid&w=740&q=80" alt="Producto 2" class="imgItemCarrito">
                    <div class="detallesItem">
                        <h4>Producto 2</h4>
                        <p class="precioItem">$15.000</p>
                        <div class="cantidadItem">
                            <button class="btnCantidad">-</button>
                            <span class="numeroItem">2</span>
                            <button class="btnCantidad">+</button>
                        </div>
                    </div>
                    <button class="btnEliminar" title="Eliminar">✕</button>
                </div>

                <div class="itemCarrito">
                    <img src="https://st2.depositphotos.com/1000689/10078/i/950/depositphotos_100781626-stock-photo-fashion-business-model-in-the.jpg" alt="Producto 3" class="imgItemCarrito">
                    <div class="detallesItem">
                        <h4>Producto 3</h4>
                        <p class="precioItem">$33.000</p>
                        <div class="cantidadItem">
                            <button class="btnCantidad">-</button>
                            <span class="numeroItem">1</span>
                            <button class="btnCantidad">+</button>
                        </div>
                    </div>
                    <button class="btnEliminar" title="Eliminar">✕</button>
                </div>

            </div>

            <div class="resumenCarrito">
                <div class="resumenLinea">
                    <span>Subtotal</span>
                    <span>$81.000</span>
                </div>
                <div class="resumenLinea descuento">
                    <span>Descuento 20% verano</span>
                    <span>- $16.200</span>
                </div>
                <div class="resumenLinea total">
                    <span>Total</span>
                    <span>$64.800</span>
                </div>
            </div>

            <div class="accionesCarrito">
                <button id="btnVaciar" class="btnSecundario">Vaciar carrito</button>
                <button id="btnComprar" class="btnPrincipal">Finalizar compra</button>
            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 Urbano Clothes. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
